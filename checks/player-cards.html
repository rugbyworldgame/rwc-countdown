<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка фотографий игроков</title><style>body{font:16px system-ui;background:#eee}button{padding:12px;margin:4px}iframe{display:block;border:1px solid #888;height:720px;max-width:100%}</style><h1>Проверка ширины Матч-центра</h1><p>Техническая страница. Размеры обозначают ширину области просмотра, а не эмуляцию устройства.</p><button data-width="320">320 px</button><button data-width="375">375 px</button><button data-width="768">768 px</button><button data-width="1280">1280 px</button><iframe title="Матч-центр для проверки" width="375" src="/match-center/#lineups-title"></iframe><script>document.querySelectorAll('button').forEach(button=>button.onclick=()=>document.querySelector('iframe').width=button.dataset.width);</script></html>
