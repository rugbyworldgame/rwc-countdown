<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка фотографий игроков</title><style>body{font:16px system-ui;background:#eee}button{padding:12px;margin:4px}iframe{display:block;border:1px solid #888;height:720px;max-width:100%}</style><h1>Проверка ширины Матч-центра</h1><p>Техническая страница. Размеры обозначают ширину области просмотра, а не эмуляцию устройства.</p><button data-width="320">320 px</button><button data-width="375">375 px</button><button data-width="768">768 px</button><button data-width="1280">1280 px</button><p id="metrics" aria-live="polite"></p><iframe title="Матч-центр для проверки" width="375" src="/match-center/?photo-check=20260925#lineups-title"></iframe><script>document.querySelectorAll('button').forEach(button=>button.onclick=()=>document.querySelector('iframe').width=button.dataset.width);setInterval(()=>{const frame=document.querySelector('iframe'),d=frame.contentDocument;if(!d)return;const card=d.querySelector('.player-photo-popover'),r=card?.getBoundingClientRect(),w=d.documentElement.clientWidth,h=frame.clientHeight;document.querySelector('#metrics').textContent=JSON.stringify({width:w,scrollWidth:d.documentElement.scrollWidth,players:d.querySelectorAll('.lineup-card li').length,photoButtons:d.querySelectorAll('.player-photo-trigger').length,open:card?!card.hidden:false,cardFits:card&&!card.hidden?r.left>=0&&r.right<=w&&r.top>=0&&r.bottom<=h:null});},500);</script></html>
