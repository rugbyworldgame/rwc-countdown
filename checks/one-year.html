<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка однодневного оформления</title><style>body{font:14px system-ui;background:#eee}button{padding:10px;margin:4px}iframe{display:block;border:1px solid #888;height:850px;max-width:100%}</style><h1>Проверка оформления 1 октября</h1><p>Настоящие страницы и настоящее время; ширина окна, без эмуляции устройства.</p><button data-width="320">320 px</button><button data-width="375">375 px</button><button data-width="1280">1280 px</button><button data-page="/">Главная</button><button data-page="/match-center/">Матч-центр</button><p id="metrics"></p><iframe title="Проверяемая страница" width="375" src="/"></iframe><script>const frame=document.querySelector('iframe');const fresh=p=>p+'?layout-check='+Date.now();frame.src=fresh('/');document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>frame.width=b.dataset.width);document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>frame.src=fresh(b.dataset.page));setInterval(()=>{const d=frame.contentDocument;if(d)document.querySelector('#metrics').textContent=JSON.stringify({width:d.documentElement.clientWidth,scrollWidth:d.documentElement.scrollWidth,campaign:!!d.querySelector('.one-year-copy,.one-year-strip'),headings:[...d.querySelectorAll('h1')].filter(e=>!e.hidden).map(e=>e.textContent),seconds:d.querySelector('#seconds')?.textContent});},500);</script></html>
