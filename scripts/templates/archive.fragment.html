<section class="shell archive-view"><a href="/match-center/">← К трансляциям</a>
<h1>Архив матчей</h1><p>Прошедшие встречи, начиная с последних. Время московское.</p>
<div id="filters" hidden><label>Команда<input id="query" type="search" placeholder="Например, Тулуза"></label><label>Турнир<select id="competition"><option value="">Все турниры</option>{{competitions}}</select></label><label>Сезон<select id="season"><option value="">Все сезоны</option>{{seasons}}</select></label><button id="reset" type="button">Сбросить</button></div>
<p id="count" role="status"></p><ul id="fixtures">{{rows}}</ul>
<nav id="pages" aria-label="Страницы архива" hidden><button id="prev" type="button">← Назад</button><span id="number"></span><button id="next" type="button">Далее →</button></nav></section>
