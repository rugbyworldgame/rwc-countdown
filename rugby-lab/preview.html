<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка размеров — Регбийная лаборатория</title>
<style>body{margin:0;background:#09131d;color:#edf4fa;font:16px system-ui}header{padding:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,a{color:inherit;background:#193246;border:1px solid #476378;padding:10px;border-radius:8px}button{cursor:pointer}button[aria-pressed=true]{background:#0d9474}iframe{display:block;border:1px solid #476378;margin:0 auto;width:390px;max-width:100%;height:844px;box-sizing:border-box}p{margin:0;font-size:14px}</style>
<header><strong>Проверка интерфейса</strong><button data-width="390" aria-pressed="true">Телефон · 390 px</button><button data-width="820" aria-pressed="false">Планшет · 820 px</button><button data-width="1200" aria-pressed="false">Компьютер · 1200 px</button><a href="./index.html">Открыть без рамки</a><p>Это проверка ширины окна. Она не заменяет тестирование на настоящем телефоне.</p></header>
<iframe title="Регбийная лаборатория — тестовый экран" src="./index.html"></iframe>
<script>document.querySelectorAll('button[data-width]').forEach(button=>button.onclick=()=>{document.querySelector('iframe').style.width=button.dataset.width+'px';document.querySelectorAll('button[data-width]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)))});</script></html>
